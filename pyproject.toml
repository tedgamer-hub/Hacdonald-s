[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hacdonalds"
version = "0.1.0"
description = "McDonald's MCP connection layer for the Hacdonald's meal planning skill"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "httpx2[socks]", "jsonschema>=4.23,<5"]

[project.scripts]
hacdonalds = "hacdonalds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hacdonalds"]
